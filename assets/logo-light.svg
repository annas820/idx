<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-labelledby="t d">
  <title id="t">IHSG</title>
  <desc id="d">Candlestick mark followed by the wordmark IHSG and the tagline: Indonesian market data for people and agents. Light-theme variant.</desc>
  <defs>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="dn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <!-- mark: a 128x128 tile of three candlesticks -->
  <rect x="16.5" y="16.5" width="127" height="127" rx="28" fill="#0b0f14"/>
  <g stroke="#1f2937" stroke-width="1">
    <line x1="32" y1="56" x2="128" y2="56"/>
    <line x1="32" y1="80" x2="128" y2="80"/>
    <line x1="32" y1="104" x2="128" y2="104"/>
  </g>
  <g stroke-linecap="round">
    <line x1="52" y1="40" x2="52" y2="124" stroke="#f43f5e" stroke-width="3"/>
    <rect x="44" y="66" width="16" height="42" rx="3" fill="url(#dn)"/>
    <line x1="80" y1="34" x2="80" y2="112" stroke="#4ade80" stroke-width="3"/>
    <rect x="72" y="44" width="16" height="52" rx="3" fill="url(#up)"/>
    <line x1="108" y1="48" x2="108" y2="118" stroke="#4ade80" stroke-width="3"/>
    <rect x="100" y="58" width="16" height="30" rx="3" fill="url(#up)"/>
  </g>
  <circle cx="52" cy="30" r="4" fill="#f8fafc"/>
  <!-- wordmark and tagline; textLength pins the tagline width on every platform font -->
  <text fill="#0b0f14" x="170" y="99" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="800" font-size="84" letter-spacing="-2" textLength="212" lengthAdjust="spacingAndGlyphs">IHSG</text>
  <text fill="#475569" x="174" y="131" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="17" textLength="356" lengthAdjust="spacingAndGlyphs">Indonesian market data for people and agents</text>
</svg>
