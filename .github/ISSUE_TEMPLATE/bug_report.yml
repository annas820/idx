name: Bug report
description: Something is wrong or a data source stopped working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: idx version
      description: Output of `idx version`
      placeholder: idx 0.1.0 (x86_64 release)
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Run with `-vv --no-cache` so the requests and HTTP statuses are included. Remove anything private.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
