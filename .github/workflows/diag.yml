name: diagnose broker source

# Manual only. The scheduled probes (27 Oct) showed HTTP 502 from IPOT at every hour, so the schedule was removed.
# Writes one log file per run into diag/. Does not touch daily.yml. Delete this file once the cause is known.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned)

      - name: Install idx
        run: |
          # Installer comes from this repo (reviewed, identical to fzn0x/idx v0.8.1), not piped from the
          # network; the release is pinned and its SHA-256 is verified by install.sh.
          IDX_VERSION=v0.8.1 sh ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Probe broker source
        shell: bash
        run: |
          set +e
          mkdir -p diag
          L="diag/log_$(TZ=Asia/Jakarta date +%d_%H%M).txt"
          : > "$L"
          echo "run at $(TZ=Asia/Jakarta date +%F_%T) WIB; runner IP: $(curl -s -m 10 https://api.ipify.org || echo unknown)" >> "$L"
          t() { echo "" >> "$L"; echo "### $*" >> "$L"; rc=0; out=$("$@" 2>&1) || rc=$?; printf '%s' "$out" | head -c 3000 >> "$L"; echo "" >> "$L"; echo "exit=$rc" >> "$L"; }
          U="https://www.indopremier.com/module/saham/include/data-brokersummary.php?code=BBCA&start=10/23/2026&end=10/23/2026&fd=all&board=all"
          t curl -si -m 25 -A "Mozilla/5.0" "$U"
          t curl -sI -m 25 https://www.indopremier.com/
          t idx -o json broker BBCA --date 2026-10-23
          t idx -o json broker TLKM --date 2026-10-22
          t idx -o json stocks actions BBCA

      - name: Commit log
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diag
          git commit -m "diag log $(date -u +%F_%H%M)" || true
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
