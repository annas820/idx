name: daily market snapshot

# Mon-Fri after the IDX close: saves a market snapshot (snapshots/<date>/), refreshes price history of the 100
# most traded stocks (hist/) and writes the CLO Forward Test v1.0 signals (signals/<date>.json).
# idx.co.id blocks GitHub runners, so those steps may fail; every step logs to status.txt.

on:
  schedule:
    - cron: "30 10 * * 1-5" # 17:30 WIB, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install idx and pandas
        run: |
          curl -fsSL https://raw.githubusercontent.com/fzn0x/idx/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pip install pandas

      - name: Take snapshot
        shell: bash
        run: |
          D=$(TZ=Asia/Jakarta date +%F)
          OUT=snapshots/$D
          mkdir -p "$OUT"
          S="$OUT/status.txt"
          : > "$S"
          WATCH="AADI,INCO,INDF,ASII,BBCA,BBRI,BMRI,BBNI,TLKM,ANTM,PTBA,ADRO,UNVR,ICBP,AKRA,BBTN"

          run() {
            name=$1; file=$2; shift 2
            if "$@" > "$OUT/$file" 2> "$OUT/$name.err"; then
              echo "OK   $name" >> "$S"
            else
              echo "FAIL $name (exit $?)" >> "$S"
            fi
          }

          run holidays   holidays.json   idx -o json market holidays --upcoming
          run overview   overview.json   idx -o json market overview --top 15
          run indices    indices.json    idx -o json market indices
          run quotes     quotes.json     idx -o json stocks quote "$WATCH"
          run returns    returns.json    idx -o json stocks returns "$WATCH"
          run news       news.json       idx -o json stocks news
          run foreign_mkt foreign_market.json idx -o json market foreign --top 15
          run bandar     bandar.json     idx -o json bandar screen --preset foreign-accumulation
          run fnet_1d    fnet_1d.json    idx -o json bandar screen --period 1d --sort fnet --desc --limit 0 --scan 100
          run fnet_5d    fnet_5d.json    idx -o json bandar screen --period 1w --sort fnet --desc --limit 0 --scan 100
          for T in AADI INCO INDF ASII; do
            run "hist_$T"  "hist_$T.csv"  idx -o csv stocks history "$T" --period 1y --interval 1d --limit 300
            run "tech_$T"  "tech_$T.json" idx -o json stocks technical "$T"
            run "frgn_$T"  "frgn_$T.json" idx -o json stocks foreign "$T" --days 20
            run "sent_$T"  "sent_$T.json" idx -o json stocks sentiment "$T"
            run "act_$T"   "act_$T.json"  idx -o json stocks actions "$T"
          done
          date -u +"run at %F %T UTC" >> "$S"

      - name: Refresh price history of the 100 most traded stocks
        shell: bash
        run: |
          D=$(TZ=Asia/Jakarta date +%F)
          mkdir -p hist
          if [ -s "snapshots/$D/fnet_5d.json" ]; then
            for SYM in $(jq -r '.data.rows[].symbol' "snapshots/$D/fnet_5d.json"); do
              idx -o csv stocks history "$SYM" --period 1y --interval 1d --limit 300 > "hist/$SYM.csv.tmp" 2>/dev/null && mv "hist/$SYM.csv.tmp" "hist/$SYM.csv" || rm -f "hist/$SYM.csv.tmp"
            done
            echo "hist files: $(ls hist | wc -l)" >> "snapshots/$D/status.txt"
          fi

      - name: Generate CLO Forward Test v1.0 signals
        shell: bash
        run: |
          D=$(TZ=Asia/Jakarta date +%F)
          mkdir -p forward_test
          cat > forward_test/ft_signal.py <<'PY'
          # CLO Forward Test v1.0 - signal generator (rules frozen; do not edit to improve results)
          import json, sys, os, random, glob
          import pandas as pd, numpy as np
          SNAP = sys.argv[1]            # snapshots/<date>
          HIST = sys.argv[2]            # hist/ directory with <SYMBOL>.csv
          OUT  = sys.argv[3]            # signals/ directory
          MIN_NET_PCT, BREADTH_MIN = 5.0, 0.40
          LIMIT_ATR, STOP_ATR, TGT_ATR, VALID, HOLD, COST = 0.5, 2.0, 4.0, 3, 10, 0.007
          d = json.load(open(os.path.join(SNAP, 'fnet_5d.json')))['data']
          t = d['to']; rows = d['rows']
          def feat(sym):
              f = os.path.join(HIST, sym + '.csv')
              if not os.path.exists(f): return None
              h = pd.read_csv(f); h['date'] = h['time'].str[:10]
              h = h[h.volume > 0].reset_index(drop=True)
              if len(h) < 60 or h.date.iloc[-1] != t: return None
              c, hi, lo = h.close, h.high, h.low
              pc = c.shift(1); tr = pd.concat([hi-lo, (hi-pc).abs(), (lo-pc).abs()], axis=1).max(axis=1)
              atr = tr.ewm(alpha=1/14, adjust=False, min_periods=14).mean().iloc[-1]
              return dict(close=float(c.iloc[-1]), atr=float(atr), ma50=float(c.rolling(50).mean().iloc[-1]))
          F = {r['symbol']: feat(r['symbol']) for r in rows}
          F = {k: v for k, v in F.items() if v}
          breadth = sum(v['close'] > v['ma50'] for v in F.values()) / max(len(F), 1)
          def plan(sym):
              v = F[sym]; lim = v['close'] - LIMIT_ATR * v['atr']
              return dict(symbol=sym, signal_date=t, close=v['close'], atr=round(v['atr'], 2), limit=round(lim, 2),
                          valid_sessions=VALID, stop_atr=STOP_ATR, target_atr=TGT_ATR, hold=HOLD, cost=COST)
          sig = []
          if breadth >= BREADTH_MIN:
              for r in rows:
                  s = r['symbol']
                  if s in F and r['signal'] in ('accumulation', 'big_accumulation') and r['net_pct'] >= MIN_NET_PCT and r['foreign_net_value'] > 0:
                      p = plan(s); p.update(broker_signal=r['signal'], net_pct=round(r['net_pct'], 2), foreign_net_value=r['foreign_net_value']); sig.append(p)
          rng = random.Random(int(t.replace('-', '')))
          pool = sorted(F); k = max(len(sig), 5) if breadth >= BREADTH_MIN else 5
          ctrl = [plan(s) for s in rng.sample(pool, min(k, len(pool)))]
          res = dict(version='CLO-FT-1.0', signal_date=t, breadth=round(breadth, 3), universe_with_data=len(F),
                     regime_ok=breadth >= BREADTH_MIN, signals=sig, controls=ctrl)
          os.makedirs(OUT, exist_ok=True)
          json.dump(res, open(os.path.join(OUT, t + '.json'), 'w'), indent=1)
          print(t, 'breadth', round(breadth, 3), 'universe', len(F), 'signals', len(sig), 'controls', len(ctrl))
          PY
          if [ -s "snapshots/$D/fnet_5d.json" ]; then
            python3 forward_test/ft_signal.py "snapshots/$D" hist signals >> "snapshots/$D/status.txt" 2>&1 || echo "FAIL forward_test" >> "snapshots/$D/status.txt"
          else
            echo "SKIP forward_test (no fnet_5d)" >> "snapshots/$D/status.txt"
          fi

      - name: Commit snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add snapshots hist signals forward_test
          git diff --cached --quiet || git commit -m "snapshot $(TZ=Asia/Jakarta date +%F)"
          git push
