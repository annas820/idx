name: news archive

# Hourly: appends new headlines from the RSS feeds listed in forward_test/news_fetch.py to news/<month>.csv
# (raw, never rewritten), then rebuilds news/digest.md and news/digest.json with forward_test/news_score.py:
# a deterministic filter (tier, category, tickers, cross-source confirmation) that drops lifestyle noise.
# Builds our own timestamped news archive, which does not exist anywhere for free.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Filter tests
        run: python3 -m unittest forward_test.test_news_score

      - name: Fetch headlines
        run: python3 forward_test/news_fetch.py news

      - name: Build digest
        run: python3 forward_test/news_score.py news data/universe.csv forward_test/watchlist.txt

      - name: Commit headlines and digest
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news
          if ! git diff --cached --quiet; then
            git commit -m "news $(TZ=Asia/Jakarta date +%F_%H:%M)"
            for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
          fi
